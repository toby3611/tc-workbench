<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC 申请工作台</title>
<link rel="stylesheet" href="assets/style.css?v=26">
</head>
<body>

<!-- 登录页 -->
<div id="login-view" class="login-view">
  <div class="login-card">
    <h1>TC 申请工作台</h1>
    <p class="login-sub">Regenagri · GRS · RCS · GOTS · OCS 多标准 TC 申请平台</p>
    <label>账号</label>
    <input id="login-account" type="text" placeholder="如 admin / userA / userB" autocomplete="username">
    <label>密码</label>
    <input id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password">
    <button id="login-btn">登录</button>
    <p id="login-error" class="login-error"></p>
    <p class="login-hint">演示账号：admin / userA / userB，密码均为 123456</p>
    <button id="skip-login-btn" style="margin-top:10px;background:#fff;color:#185FA5;border:0.5px solid #185FA5;">直接进入工作台（预览模式）</button>
  </div>
</div>

<!-- 主应用 -->
<div id="app-view" class="app-view" style="display:none">
  <header class="topbar">
    <div class="brand">TC 申请工作台</div>
    <div class="user-area">
      <span id="current-user"></span>
      <button id="logout-btn">退出</button>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar">
      <div class="side-title">TC 证书申请模块</div>
      <ul class="nav-menu" id="module-menu"></ul>
      <div class="side-title" style="margin-top:18px;">系统</div>
      <ul class="nav-menu">
        <li data-view="settings">系统配置</li>
      </ul>
    </nav>
    <main id="main-content" class="main-content"></main>
  </div>
</div>

<script src="assets/seed.js?v=26"></script>
<script src="assets/data.js?v=26"></script>
<script src="assets/auth.js?v=26"></script>
<script src="assets/lib/xlsx.full.min.js"></script>
<script src="assets/lib/pdf.min.js"></script>
<script src="assets/lib/mammoth.browser.min.js"></script>
<script src="assets/app.js?v=26"></script>
</body>
</html>
